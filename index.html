<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starlite Live</title>
    <link href="https://vjs.zencdn.net/7.15.4/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/7.15.4/video.min.js"></script>
    <style>
      :root {
        --bg: #e8e8e8;
        --surface: #ffffff;
        --text: #1a1a1a;
        --muted: #777777;
        --line: #d0d0d0;
        /* Red. The Live badge used to own this and was removed, so nothing else
           on the page is red now and it is free to mean one thing: muted. */
        --accent: #e82127;
        /* Green means InMotion is on, and sound is coming out of the speaker. It
           is not used as a generic "good" colour on buttons, so a green pill in
           the header still reads as a mode or a working speaker and not as
           decoration. */
        --go: #12a150;
        /* The loading ink. The spinner ring and the "Loading" label are the same
           colour, so it is declared once here and they cannot drift apart. */
        --load: rgba(255, 255, 255, 0.72);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        color-scheme: light;
      }
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        font-weight: 300;
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      @media(min-width:700px) and (max-width:840px){
        html{zoom:0.6}
      }

      header {
        width: 100%;
        padding: 28px 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      /* Sits immediately to the right of the All Media link, so the two read as
         one group rather than the toggle drifting off to the far edge. */
      header .left {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .all-media {
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase;
        transition: color 0.2s;
      }
      .all-media:hover {
        color: var(--text);
      }

      main {
        width: 100%;
        max-width: 1200px;
        padding: 20px 40px 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Both picture surfaces share this box, so the banner over them lines up with
         whichever is showing, and the WIDE toggle only has to move one element. */
      #frame {
        position: relative;
        width: 100%;
        max-width: 1120px;
        margin-bottom: 48px;
      }
      #myPlayer {
        display: none;
        width: 100%;
        max-width: 1120px;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
      }
      #myPlayer.vjs-fluid {
        display: block;
      }
      .video-js .vjs-control-bar {
        font-size: 16px;
      }

      /* ---- InMotion mode ----------------------------------------------
         The <video> element is what freezes when the car is in Drive, so in
         this mode the picture is drawn to a canvas by WebCodecs instead and no
         media element is used for video at all.

         The canvas sits inside a stage that is ALWAYS present while the mode is
         on, so at rest you get a black screen rather than no screen: it reads
         as a player that is idle, not as a page that has failed to load. The
         same box carries the loading state, which matters in a car where a
         silent black rectangle is indistinguishable from a crash. */
      #myPlayer.hidden-el,
      #myCanvas.hidden-el,
      #stage.hidden-el,
      #stageMsg.hidden-el,
      #epgBar.hidden-el {
        display: none !important;
      }
      /* ---- What's on / what's next -----------------------------------------
         A banner across the top of the frame. Sized to be read at a glance
         from the driver's seat. It carries its own ink rather than assuming
         one: over live video there is no background to promise contrast.

         The plate fades to NOTHING at its lower edge, so there is no line where
         the banner ends and the picture begins. A banner that stops at a fixed
         opacity puts a hard horizontal edge across live video, and the eye reads
         that as a band rather than as an overlay. Fading all the way out makes
         the type look like it is coming out of the picture instead. */
      #epgBar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 0 26px;
        /* Rounded only at the top, to follow the frame underneath. A full radius
           would leave the bottom corners floating over the picture. WIDE drops
           the frames' radius, so it drops this one too. */
        border-radius: 12px 12px 0 0;
        /* A quarter of the frame. Big enough that the guide reads as part of the
           picture's furniture rather than a strip of text stuck to the edge. */
        height: 25%;
        /* Dark enough under the type to be certain of contrast on any frame,
           then a long fade: most of the height is spent getting to nothing, so
           the transition is gradual rather than a cliff. */
        background: linear-gradient(to bottom,
                                    rgba(0, 0, 0, 0.94) 0%,
                                    rgba(0, 0, 0, 0.9) 38%,
                                    rgba(0, 0, 0, 0.72) 58%,
                                    rgba(0, 0, 0, 0.44) 76%,
                                    rgba(0, 0, 0, 0.18) 90%,
                                    rgba(0, 0, 0, 0) 100%);
        color: #fff;
        /* Sized to be read at a glance from the driver's seat, which is what the
           whole banner is for. */
        font: 400 27px/1.28 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        /* Taps belong to the player underneath. */
        pointer-events: none;
        /* The banner is a greeting, not furniture: it arrives when a channel
           does, holds long enough to be read, and then gets out of the way of
           the picture. A tap on the frame brings it back. */
        opacity: 1;
        transition: opacity 0.45s ease;
      }
      #epgBar.gone {
        opacity: 0;
      }
      #epgBar .epgInfo {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      #epgBar .epgLine {
        display: flex;
        align-items: baseline;
        gap: 16px;
        min-width: 0;
      }
      /* The lead-in is quieter than the value: the programme is the information,
         "now playing" only says what kind of information it is. A fixed lead-in
         width lines the two values up on one left edge. The countdown is styled
         as a lead-in too, so "next in 35min" sits in the same column as "now
         playing" and both titles start at the same x. */
      #epgBar b,
      #epgBar i {
        flex: 0 0 auto;
        min-width: 148px;
        font-size: 15px;
        font-style: normal;
        /* The "now playing" lead-in is heavier than the countdown beside it: it
           labels the primary line, and the two are not the same kind of
           information. */
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.62);
      }
      /* The countdown keeps the banner's own weight. It updates every 30 seconds, and
         a number that changes while set heavier than its label draws the eye to
         the wrong line. */
      #epgBar i {
        text-transform: none;
        letter-spacing: 2.6px;
        font-weight: 400;
      }
      #epgBar span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* The programme being watched is the one line that has to land at a
         glance, so it is set heavier than the banner around it. Declared after
         the #epgBar span rule on purpose: both set a weight, and equal
         specificity means the later one wins, so putting it above would be
         silently ignored. The countdown keeps the banner's own weight - it is a
         changing detail, and matching it would make both lines shout. */
      #epgBar #epgNow {
        font-weight: 900;
      }
      #epgLogo {
        flex: 0 0 auto;
        width: 186px;
        height: 104px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        /* Every logo white, whatever colour it arrived in. brightness(0) collapses all
           three channels to black, then invert(1) flips that to pure white. The
           two steps in that order matter: brightness(0) on its own would leave
           a black logo, and invert(1) alone would just swap the bright ones
           (AMC, CNN, Fox) to black and lose them against the banner.

           Lettering survives because these logos knock out with TRANSPARENCY,
           not with dark pixels, so the shape is carried by the alpha channel and
           the filter never touches it. Verified against the awkward ones - ESPN-U
           (red on black), Golf Channel (multi-colour peacock), Fox Sports 1 and
           ACC (two-tone), TNT and AMC (white with knocked-out letters) - all of
           which come out white and readable. */
      }
      #stage {
        display: none;
        position: relative;
        width: 100%;
        max-width: 1120px;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
      }
      #stage.on {
        display: block;
        animation: stageIn 0.22s ease;
      }
      @keyframes stageIn {
        from { opacity: 0; transform: translateY(-6px); }
        to { opacity: 1; transform: none; }
      }
      #myCanvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #stageMsg {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        color: var(--load);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        /* After the font shorthand, which would otherwise reset it. */
        font-weight: 600;
        letter-spacing: 4px;
        text-transform: uppercase;
        pointer-events: none;
      }
      #stageMsg .spin {
        position: relative;
        /* Sized to be read at a glance from the driver's seat, which is the
           whole point of this state: a ring too small to notice at a glance is
           indistinguishable from black. */
        width: 96px;
        height: 96px;
        border-radius: 50%;
        /* A single arc that fades in as it goes round, drawn as a conic gradient
           and masked down to a thin ring. Thinner and quieter than a bordered
           circle. It is in the same ink as the Loading label, not the toggle
           green: the ring and the word are one message, so the bright head of
           the arc lands exactly on the label's own colour. */
        background: conic-gradient(from 0deg,
          rgba(255, 255, 255, 0) 0deg,
          rgba(255, 255, 255, 0.25) 130deg,
          rgba(255, 255, 255, 0.6) 250deg,
          var(--load) 360deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
        animation: spin 0.85s linear infinite;
      }
      /* A second, slower ring turning the other way, so the motion reads as
         deliberate rather than as one shape being rotated. Barely there - the
         point is to show something is happening, not to perform. */
      #stageMsg .spin::after {
        content: "";
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        background: conic-gradient(from 180deg,
          rgba(255, 255, 255, 0) 0deg,
          rgba(255, 255, 255, 0.36) 300deg,
          rgba(255, 255, 255, 0.09) 360deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
        animation: spinBack 1.6s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes spinBack {
        to { transform: rotate(-360deg); }
      }
      /* Respect a stated preference for less motion: hold the arcs still rather
         than removing them, since the ring is also the thing saying "working". */
      @media (prefers-reduced-motion: reduce) {
        #stageMsg .spin,
        #stageMsg .spin::after,
        #stage.on {
          animation: none !important;
        }
        /* The banner still appears and disappears, it just stops travelling to
           do it. Taking it away instantly would defeat the point of it. */
        #epgBar {
          transition: none !important;
        }
      }

      /* The Channels heading doubles as the stop control. No visible label for
         it: a permanent "tap to stop" competes with the heading, and it has to
         be discovered by touching it anyway. */
      .section-title.stoppable {
        cursor: pointer;
        transition: color 0.2s;
      }
      .section-title.stoppable:hover {
        color: var(--text);
      }

      /* The toggle. Labelled from its state so it is obvious which mode is
         active without reading anything. */
      #driveToggle {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 14px 7px 10px;
        font: inherit;
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
        cursor: pointer;
        transition: color 0.2s, border-color 0.2s, background 0.2s;
      }
      #driveToggle:hover {
        color: var(--text);
        border-color: var(--text);
      }
      #driveToggle .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--line);
        transition: background 0.2s, box-shadow 0.2s;
      }
      #driveToggle.on {
        color: var(--go);
        border-color: var(--go);
        background: rgba(18, 161, 80, 0.08);
      }
      #driveToggle.on .dot {
        background: var(--go);
        box-shadow: 0 0 8px var(--go);
      }

      /* Wide and Mute, immediately right of InMotion, so the header reads as
         one row of controls rather than a link and two stray buttons. They
         borrow its pill shape for the same reason. Wide comes first because it
         is a mode like InMotion; Mute is a one-touch action and sits last.

         Neither turns green for the reason InMotion does: --go has to keep
         meaning "this is the mode you are in". Mute is the exception, and only
         because its green/red reports a fact about the audio rather than
         claiming to be a mode. Wide stays in ink, so a green pill in the
         header is never ambiguous. See the Mute rules further down. */
      #muteToggle,
      #wideToggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 12px;
        font: inherit;
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
        cursor: pointer;
        transition: color 0.2s, border-color 0.2s, background 0.2s;
      }
      #wideToggle {
        padding: 7px 14px 7px 10px;
      }
      #muteToggle:hover,
      #wideToggle:hover {
        color: var(--text);
        border-color: var(--text);
      }
      /* 16px -> 21px, a 31% bump, so the speaker is readable at arm's length in a
         car. Note the stroke thickens as well: it is 2 units in a 24-unit
         viewBox, so it renders at 2*21/24 = 1.75px instead of 1.33px. That is
         wanted, but it means the icon gains weight as well as size.

         The svg is this button's ONLY content, so the pill is sized entirely by
         it plus padding - grow the icon and the pill grows with it. The padding
         below hands back exactly the 5px the icon gained, 2.5px a side, holding
         the button at its original 42x32. These two numbers are a pair: change
         one and the other has to move with it. */
      #muteToggle svg {
        display: block;
        width: 21px;
        height: 21px;
      }
      #muteToggle {
        padding: 4.5px 9.5px;
      }
      /* The icon is the whole label, so a state change swaps the glyph rather
         than the word. The speaker stays put and the waves are replaced by a
         cross in the same 24x24 box, so the button does not shift. */
      #muteToggle .cross { display: none; }
      #muteToggle.on .waves { display: none; }
      #muteToggle.on .cross { display: block; }
      /* Mute is the one control here whose state is good/bad rather than
         on/off, so it is the one that gets colour: green while sound is coming
         out, red once it is muted. Wide stays in ink beside it.

         Note which class means what, because it is the opposite of what "on"
         suggests. setMute() adds .on when MUTED is true, so .on is the MUTED
         state and the colour is on the element itself for sound and on .on for
         muted. */
      #muteToggle {
        color: var(--go);
        border-color: rgba(18, 161, 80, 0.4);
      }
      #muteToggle.on {
        color: var(--accent);
        border-color: rgba(232, 33, 39, 0.4);
        background: rgba(232, 33, 39, 0.07);
      }
      /* Hover must not fall back to ink. On a green button that reads as the
         state being cancelled rather than the control being highlighted, so
         each state just goes to its own colour at full strength. */
      #muteToggle:hover {
        color: var(--go);
        border-color: var(--go);
      }
      #muteToggle.on:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      #wideToggle.on {
        color: var(--text);
        border-color: var(--text);
        background: rgba(26, 26, 26, 0.06);
      }
      /* Wide keeps a dot like InMotion, in ink rather than green. */
      #wideToggle .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--line);
        transition: background 0.2s;
      }
      #wideToggle.on .dot {
        background: var(--text);
      }

      /* Wide. The picture is pulled out of the padded, max-width column it
         normally sits in and stretched edge to edge across the viewport.

         Done by widening the column and giving the grid its old 1200px back,
         rather than by pulling the player out with 100vw and a negative
         margin. 100vw includes the scrollbar, which would put a horizontal
         scrollbar on the page for the sake of a few pixels the picture does
         not need. Everything below uses 100%, so it is measured against the
         body, which is already scrollbar-safe.

         The Channels heading is deliberately NOT in this list. It is centred
         in the column, and the column stays centred in the viewport, so it
         lands in the same place either way; giving it the padding back would
         only left-align it. */
      body.wide main {
        max-width: none;
        padding-left: 0;
        padding-right: 0;
      }
      body.wide #channelGrid {
        width: 100%;
        max-width: 1200px;
        padding-left: 40px;
        padding-right: 40px;
        box-sizing: border-box;
      }
      body.wide #myPlayer,
      body.wide #stage {
        max-width: none;
        border-radius: 0;
      }
      /* The wrapper carries the width in WIDE, so it has to follow, or the
         picture would be edge to edge while the banner stayed inset. */
      body.wide #frame {
        max-width: none;
      }
      body.wide #epgBar {
        border-radius: 0;
      }

      /* A short-lived note, used for the "this channel can't use InMotion"
         fallback and for a tap that needs sound. Deliberately quiet: it should
         not become a permanent panel in a car. */
      #note {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%) translateY(10px);
        background: rgba(0, 0, 0, 0.86);
        color: #fff;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        letter-spacing: 0.4px;
        padding: 10px 18px;
        border-radius: 999px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s, transform 0.3s;
        z-index: 30;
        max-width: 84vw;
        text-align: center;
      }
      #note.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .section-title {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 28px;
      }

      .channel-grid {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
        gap: 14px;
        justify-items: center;
      }
      .channel {
        display: flex;
        align-items: center;
        cursor: pointer;
        opacity: 0.5;
        transition: opacity 0.25s ease;
      }
      .channel:hover {
        opacity: 1;
      }
      .channel img {
        width: 58px;
        height: 58px;
        object-fit: contain;
        transition: transform 0.25s ease;
        filter: grayscale(100%) brightness(0.08) contrast(1.2);
        opacity: 0.9;
      }
      .channel.selected {
        opacity: 1;
      }
      .channel.selected img {
        transform: scale(1.15);
        filter: grayscale(100%) brightness(0.6) contrast(1.2);
      }

      .video-js .vjs-big-play-button {
        border: none;
        line-height: 1;
        height: 1.5em;
        border-radius: 100%;
      }
    </style>
  </head>
  <body>

    <header>
      <div class="left">
        <a class="all-media" href="https://berno22.github.io/">All Media</a>
        <button id="driveToggle" type="button" aria-pressed="false"
                title="InMotion mode: decode with WebCodecs and draw to a canvas, so playback keeps running while the car is in Drive">
          <span class="dot"></span><span id="driveLabel">InMotion</span>
        </button>
        <button id="wideToggle" type="button" aria-pressed="false"
                title="Wide: stretch the picture from edge to edge across the screen">
          <span class="dot"></span><span>Wide</span>
        </button>
        <!-- Mute is icon-only, so it carries aria-label and title instead of a
             visible word. Both are rewritten with the state. It sits to the
             right of Wide so the worded control is not split away from the
             mode pill by the icon. -->
        <button id="muteToggle" type="button" aria-pressed="false"
                aria-label="Mute sound" title="Mute sound">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" focusable="false">
            <path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/>
            <path class="waves" d="M15.5 8.6a5 5 0 0 1 0 6.8"/>
            <path class="waves" d="M18.2 6a8.6 8.6 0 0 1 0 12"/>
            <path class="cross" d="m16.6 9.4 5 5M21.6 9.4l-5 5"/>
          </svg>
        </button>
      </div>
      <!-- The red LIVE badge used to live here. It only ever said "a stream is
           running", which the picture already says, and it was the one red
           thing left on a page that is otherwise black, white and green. -->
    </header>

    <main>
      <!-- Both picture surfaces live in here: the normal player and the
           InMotion canvas. The wrapper is what lets one banner sit over
           whichever is showing, and gives a single element to listen to for a
           tap on the picture. It is NOT clipped (overflow is deliberately left
           alone), so a player going fullscreen is not cut off by its wrapper. -->
      <div id="frame">
        <video id="myPlayer" class="video-js" controls></video>

        <!-- InMotion picture. WebCodecs frames are painted straight onto the
             canvas; the stage around it is what you actually see, and it stays
             on screen (black) whenever the mode is on, even at rest. -->
        <div id="stage">
          <canvas id="myCanvas" width="1280" height="720"></canvas>
          <div id="stageMsg" class="hidden-el">
            <span class="spin"></span><span id="stageMsgText">Loading</span>
          </div>
        </div>

        <!-- What is on, and what is next, as a banner across the top of the
             picture. It sits over whichever frame is showing rather than
             inside one of them, so switching modes does not lose it. Top
             corners only: the frames below round theirs, and the banner has to
             follow them rather than float over the page. -->
        <div id="epgBar" class="hidden-el">
          <div class="epgInfo">
            <div class="epgLine"><b>Now playing</b><span id="epgNow">&mdash;</span></div>
            <div class="epgLine" id="epgNextLine"><i id="epgNext">IN &mdash;</i><span id="epgNextTitle">&mdash;</span></div>
          </div>
          <img id="epgLogo" alt="" decoding="async">
        </div>
      </div>

      <h1 class="section-title stoppable" id="channelsHeading" role="button" tabindex="0"
          aria-label="Channels, tap to stop playback">Channels</h1>
      <div id="channelGrid" class="channel-grid"></div>
    </main>

    <script>

      var baseUrl2 = 'best/api/stream/';
      var baseUrl3 = 'ddo';
      var baseUrl4 = '514';
      var baseUrl5 = '2011';
      var baseUrl6 = '/2';
      var baseUrl7 = '+{KwUO8:5$41m';
      var baseUrl8 = '/livetv.epg/';

      var canvas = document.getElementById('myCanvas');
      var stage = document.getElementById('stage');
      var stageMsg = document.getElementById('stageMsg');
      var stageMsgText = document.getElementById('stageMsgText');

      var driveLabel = document.getElementById('driveLabel');
      var muteToggle = document.getElementById('muteToggle');

      // =====================================================================

        stats: Q.get('stats') !== '0'

      var engine = null;
      var libsLoading = null;
      var currentChannel = null;
      var noteTimer = 0;
      var loadTimer = 0;

      // =====================================================================
      // Mute and Wide
      //

      // whenever InMotion is switched off, so a flag kept on it would be lost
      // across that switch and the next engine would come back unmuted while
      // the button still showed as muted.
      //
      // Both are remembered like the InMotion choice, so the page comes back
      // the way it was left. ?wide= and ?mute= force either one for a test
      // without touching storage.
      // =====================================================================
      function prefFlag(name, key, dflt) {
        var v = Q.get(name);
        if (v === '1') return true;
        if (v === '0') return false;
        var stored = null;
        try { stored = localStorage.getItem(key); } catch (e) {}
        if (stored === null) return dflt;
        return stored === '1';
      }
      var WIDE = prefFlag('wide', 'livetv.wide', false);
      var MUTED = prefFlag('mute', 'livetv.mute', false);

      // Pushes the current flags at everything that renders them: the two
      // buttons, the video.js element and, if one exists, the engine. Idempotent
      // on purpose, so it is safe to call after any change and after the engine
      // is rebuilt.
      function applyMute() {
        muteToggle.classList.toggle('on', MUTED);
        muteToggle.setAttribute('aria-pressed', MUTED ? 'true' : 'false');
        // The icon shows what the button will do, so the label has to follow it
        // rather than name the state.
        var label = MUTED ? 'Unmute sound' : 'Mute sound';
        muteToggle.setAttribute('aria-label', label);
        muteToggle.title = label;
        try { player.muted(MUTED); } catch (e) {}
        if (engine) engine.setMuted(MUTED);
      }
      function setMute(on, skipPersist) {
        MUTED = !!on;
        if (!skipPersist) {
          try { localStorage.setItem('livetv.mute', MUTED ? '1' : '0'); } catch (e) {}
        }
        applyMute();
      }
      function setWide(on, skipPersist) {
        WIDE = !!on;
        if (!skipPersist) {
          try { localStorage.setItem('livetv.wide', WIDE ? '1' : '0'); } catch (e) {}
        }
        document.body.classList.toggle('wide', WIDE);
        wideToggle.classList.toggle('on', WIDE);
        wideToggle.setAttribute('aria-pressed', WIDE ? 'true' : 'false');
      }
      muteToggle.addEventListener('click', function () { setMute(!MUTED); });
      wideToggle.addEventListener('click', function () { setWide(!WIDE); });
      // video.js has its own mute button in the control bar. Mirror it here so
      // the two never disagree about which state sound is in.
      player.on('volumechange', function () {
        var m = player.muted();
        if (m !== MUTED) setMute(m);
      });

      // The stage is only on screen when there is something to put in it. An
      // empty black rectangle above the channel grid said nothing and took up
      // most of the first screen; collapsed, the page opens straight onto the
      // grid and the picture appears where you tapped.
      var stageUp = false;
      function setStageUp(up) {
        stageUp = !!up && DRIVE.on;
        var show = DRIVE.on && stageUp;
        stage.classList.toggle('on', show);
        stage.classList.toggle('hidden-el', !show);
        // Nothing to look at, so nothing to be loading.
        if (!show) showIdle();
      }

      // Three states on one black box, because in a car a silent rectangle is
      // indistinguishable from a crash: loading (spinner), playing (picture),
      // and the collapsed state above.
      function showIdle() {
        clearLoadTimer();
        stageMsg.classList.add('hidden-el');
      }
      function showLoading(text) {
        stageMsgText.textContent = text || 'Loading';
        stageMsg.classList.remove('hidden-el');
        clearLoadTimer();
        // If it never arrives, say so rather than spinning forever: a stuck
        // spinner is indistinguishable from a crash just as much as black is.
        loadTimer = setTimeout(function () {
          stageMsgText.textContent = 'Still loading - tap a channel to retry';
        }, 12000);
      }
      function clearLoadTimer() {
        if (loadTimer) { clearTimeout(loadTimer); loadTimer = 0; }
      }

      // =====================================================================
      // What's on / what's next
      //
      // The guide is a single gzipped XMLTV file: about 6 MB over the wire and
      // roughly 70 MB of text once expanded, covering every channel the
      // provider carries, not just the ones on this page. Decompressing that
      // into a string and handing it to DOMParser costs a couple of hundred
      // megabytes and a visible stall, so it is never done.
      //
      // Instead the response is streamed through DecompressionStream and
      // scanned a chunk at a time, keeping only two entries per channel - the
      // programme playing now and the one after it. That is all the overlay
      // ever shows, and it turns a 70 MB document into a few hundred KB.
      //
      // One pass serves every channel, so switching channels is a lookup and
      // not a download. The pass runs on idle rather than at load: it is 6 MB,
      // which should not be spent before anyone has asked to watch anything.
      // =====================================================================
      var EPG_URL = 'https://starlite.best/api/epg/ddo5142011/2+{KwUO8:5$41m/full.xml.gz';
      // Fetched ONCE per page load, at load. It is 6 MB and it covers every
      // channel on the page at once, so re-fetching it later buys very little -
      // a guide that is a couple of hours stale is still the right answer to
      // "what is on", and the countdown is computed against the clock rather
      // than against the file, so it stays honest as time passes.
      var epgIndex = {};
      var epgBusy = null;

      // xmltv timestamps are "20261004020000 +0000", always UTC, which is worth
      // relying on: comparing them as local time would shift every programme by
      // the car's offset and put "up next" on the wrong side of the clock.
      function epgWhen(s) {
        var m = /^\s*(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/.exec(s || '');
        if (!m) return NaN;
        return Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
      }

      function epgText(s) {
        return String(s || '')
          .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
          .replace(/&quot;/g, '"').replace(/&#39;|&apos;/g, "'")
          .replace(/&nbsp;/g, ' ')
          .trim();
      }

      // Matched against the whole chunk rather than sliced into blocks first:
      // a global regex walks the buffer once, and the text between matches is
      // never copied anywhere.
      var EPG_BLOCK = /<programme\b([^>]*)>([\s\S]*?)<\/programme>/g;

      function epgHarvest(block, now, into) {
        var ch = /channel="([^"]+)"/.exec(block[1]);
        if (!ch) return;
        var st = /\bstart="([^"]+)"/.exec(block[1]);
        var sp = /\bstop="([^"]+)"/.exec(block[1]);
        if (!st || !sp) return;
        var from = epgWhen(st[1]), to = epgWhen(sp[1]);
        if (!(from <= now && now < to) && !(from > now)) return;
        var ti = /<title[^>]*>([\s\S]*?)<\/title>/.exec(block[2]);
        var title = epgText(ti && ti[1]);
        var e = into[ch[1]] || (into[ch[1]] = { now: null, next: null });
        if (from <= now && now < to) {
          if (!e.now) e.now = { from: from, to: to, title: title };
        } else if (from > now) {
          // Programmes are in time order per channel, so the first one starting
          // after now is the next one. Anything later is not worth keeping.
          if (!e.next) e.next = { from: from, to: to, title: title };
        }
      }

      function epgScan() {
        return fetch(EPG_URL, { credentials: 'omit' })
          .then(function (res) {
            if (!res.ok) throw new Error('epg http ' + res.status);
            if (!res.body || !self.DecompressionStream) throw new Error('no stream support');
            return res.body.pipeThrough(new DecompressionStream('gzip')).getReader();
          })
          .then(function (reader) {
            var dec = new TextDecoder('utf-8');
            var into = {};
            var carry = '';
            function pump() {
              return reader.read().then(function (r) {
                // decode(..., {stream:true}) keeps multi-byte characters that
                // straddle a chunk boundary intact.
                carry += r.done ? dec.decode() : dec.decode(r.value, { stream: true });
                EPG_BLOCK.lastIndex = 0;
                var m, consumed = 0;
                while ((m = EPG_BLOCK.exec(carry))) {
                  epgHarvest(m, epgNowMs, into);
                  consumed = EPG_BLOCK.lastIndex;
                }
                // Drop everything up to the end of the last complete match and
                // keep only the block the chunk edge cut in half. Trimming to
                // the regex's own lastIndex instead would be wrong: a failed
                // exec resets it to 0, so nothing would ever be released and
                // appending each chunk onto 70 MB of carried text would make
                // the scan quadratic.
                carry = carry.slice(consumed);
                return r.done ? into : pump();
              });
            }
            return pump();
          });
      }

      // Set once at the start of a pass and held for its duration, so every
      // programme in a 70 MB file is judged against the same instant. Judging
      // each against a fresh Date.now() would make the last channel in the file
      // answer for a slightly later time than the first.
      var epgNowMs = 0;

      function epgRefresh() {
        if (epgBusy) return epgBusy;
        epgNowMs = Date.now();
        epgBusy = epgScan()
          .then(function (into) {
            epgIndex = into;
            // Repaint now, not on the next channel change: the guide usually
            // lands while a channel is already on screen, and without this the
            // logo would sit there with no text until the next tap.
            epgPaint();
          })
          .catch(function () {
            // A missing guide is not worth a message: the banner just stays
            // empty. Failing quietly keeps a 6 MB download failure from looking
            // like the player broke.
          })
          .then(function () {
            epgBusy = null;
          });
        return epgBusy;
      }

      // ---------------------------------------------------------------------
      // Painting. The countdown is recomputed on a timer rather than trusted to
      // stay right, because a car can sit parked with the page open.
      // ---------------------------------------------------------------------
      function epgPaint() {
        if (!epgBar || !currentChannel) return;
        var e = epgIndex[currentChannel];
        epgNextLine.style.display = 'none';
        if (!e || (!e.now && !e.next)) {
          // No guide entry for this channel. The logo alone still identifies it,
          // so the bar stays rather than disappearing.
          epgInfo.style.visibility = 'hidden';
          return;
        }
        epgInfo.style.visibility = '';
        epgNow.textContent = e.now && e.now.title ? e.now.title : '—';
        if (e.next) {
          epgNextLine.style.display = '';
          epgNextTitle.textContent = e.next.title || '—';
          epgPaintCountdown();
        }
      }

      // Both halves of the up-next row: the countdown, which changes on its own
      // every 30 seconds, and the title behind it, which does not. Only the
      // countdown is redrawn here.
      function epgPaintCountdown() {
        var e = currentChannel && epgIndex[currentChannel];
        if (!e || !e.next) return;
        var left = e.next.from - Date.now();
        if (left < 60000) {
          // Under a minute, counting in minutes would say "IN 1 MIN" all the
          // way down to zero, and keep saying it after the programme had
          // started.
          epgNext.textContent = 'IN ' + Math.max(0, Math.round(left / 1000)) + ' SEC';
        } else {
          epgNext.textContent = 'IN ' + Math.ceil(left / 60000) + ' MIN';
        }
      }

      // Whether there is a picture underneath to put the banner on. Without this the
      // banner appears the instant a channel is tapped, which is before the
      // frame is up - so it flashes over a black box, or over the gap where the
      // frame is about to be. A banner with no picture under it is a caption
      // floating in space.
      function frameIsUp() {
        if (DRIVE.on) {
          // InMotion: the stage has to be raised AND the engine has to have put
          // a frame on the canvas. A raised-but-empty stage is a black box.
          if (!stage.classList.contains('on')) return false;
          var st = engine && engine.live ? engine.live : null;
          return !!(st && st.drawn > 0);
        }
        // Normal player: the element has to be on screen with media in it.
        // NOTE: getElementById('myPlayer') is NOT the <video> here. video.js
        // replaces it with a wrapper DIV that keeps the id and carries the
        // vjs-* classes; the real element is a child and takes the id
        // myPlayer_html5_api. Reading readyState off the DIV gives undefined,
        // which compares false and would leave the banner hidden forever.
        var v = document.querySelector('#myPlayer video');
        return !!(v && v.readyState >= 2);
      }

      // Called when the channel changes, and from the tick below. The data is
      // loaded and painted straight away - it is cheap and the guide may not be
      // there yet - but the banner itself waits for a frame to appear.
      function showEpg(channel) {
        if (!epgBar) return;
        if (!channel) {
          epgBar.classList.add('hidden-el');
          clearTimeout(epgHideTimer);
          return;
        }
        epgLogo.src = 'logos/' + channel + '.png';
        // Decorative, and the grid hides a logo it cannot load rather than
        // showing a broken-image box. The same here: not every channel in the
        // guide has a logo file.
        epgLogo.alt = '';
        epgLogo.style.display = '';
        epgLogo.onerror = function () { epgLogo.style.display = 'none'; };
        epgPaint();
        epgSync();
        // Switching channel while the banner is already up has to bring it back
        // and restart its hold, or the new channel's title would arrive under a
        // banner that is halfway through fading out. epgSync() only reveals on
        // the hidden edge, so this asks for it explicitly.
        if (!epgBar.classList.contains('hidden-el')) epgReveal();
      }

      // Show the banner if and only if there is a frame under it and a channel
      // selected. Both directions matter: it hides again if the frame goes away
      // (mode switched off, playback stopped) and shows when one arrives.
      //
      // Note the transition guard: epgReveal() RESTARTS the fade timer, so
      // calling it on every tick would reset the countdown a few hundred times a
      // second and the banner would sit there permanently, never fading out.
      // It is only called on the hidden -> shown edge; once it is up, staying up
      // is nobody's business but the timer and the user's tap.
      function epgSync() {
        if (!epgBar) return;
        if (currentChannel && frameIsUp()) {
          var wasHidden = epgBar.classList.contains('hidden-el');
          epgBar.classList.remove('hidden-el');
          if (wasHidden) epgReveal();
        } else {
          epgBar.classList.add('hidden-el');
          clearTimeout(epgHideTimer);
        }
      }

      // How long the banner stays up before it fades out of the picture.
      var EPG_HOLD_MS = 5000;
      var epgHideTimer = 0;

      // Show it and restart the clock. Called on every channel change and on
      // every tap of the frame, so the two paths cannot drift apart.
      function epgReveal() {
        if (!epgBar || epgBar.classList.contains('hidden-el')) return;
        epgBar.classList.remove('gone');
        clearTimeout(epgHideTimer);
        epgHideTimer = setTimeout(function () {
          epgBar.classList.add('gone');
        }, EPG_HOLD_MS);
      }

      // A tap anywhere on the picture brings the banner back for another
      // stretch, in either mode. It is the only thing the picture itself does,
      // and it had no handler before, so nothing is taken away from the player.
      //
      // The stop() is the important part. In the normal player a tap on the
      // video is a PLAY/PAUSE, and video.js binds it on the element itself, so a
      // plain listener on an ancestor is too late to stop it - hence capture,
      // which runs before the event ever reaches the video. Without this, the
      // banner would reappear but the picture would pause under the driver's
      // finger, which is the opposite of what a tap on the picture should do.
      //
      // The player's own controls are let through: a tap on the control bar, or
      // on the big play button covering the picture before playback starts, has
      // to keep working or the fallback player would be unusable.
      frame.addEventListener('click', function (e) {
        var t = e.target;
        if (t && t.closest && t.closest('.vjs-control-bar, .vjs-big-play-button')) return;
        if (!epgBar.classList.contains('hidden-el')) epgReveal();
        if (!DRIVE.on) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);

      // The two libraries are only fetched when InMotion mode is actually used, so
      // an ordinary desktop visit does not pay for them.
      var LIB_SOURCES = [
        'https://cdn.jsdelivr.net/npm/mux.js@6.3.0/dist/mux.js',
        'https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js'
      ];

      function loadScript(src) {
        return new Promise(function (res, rej) {
          var s = document.createElement('script');
          s.src = src;
          s.onload = res;
          s.onerror = function () { rej(new Error('failed to load ' + src)); };
          document.head.appendChild(s);
        });
      }

      function ensureEngine() {
        if (engine) return Promise.resolve(engine);
        if (libsLoading) return libsLoading;
        libsLoading = loadScript('tesla-engine.js').then(function () {
          // Sequential on purpose: mp4box and mux.js are independent, but
          // keeping it ordered makes a failure obvious.
          return LIB_SOURCES.reduce(function (p, src) {
            return p.then(function () { return loadScript(src); });
          }, Promise.resolve());
        }).then(function () {
          engine = new TeslaPlayer({ canvas: canvas, gain: DRIVE.gain, maxWidth: DRIVE.maxw, muted: MUTED });
          engine.on('note', showNote);
          engine.on('fail', onEngineFail);
          // Clear the loading state on the first painted frame, not on a timer.
          // A fixed delay is either slower than it needs to be or flickers the
          // picture away for a frame; the engine already knows when a frame
          // arrives.
          engine.on('state', function (st) {
            if (!st) return;
            // 'idle' here does NOT mean the page stopped. engine.open() closes
            // the previous stream internally, so every channel change arrives
            // as an idle state while the new one is still starting. Collapsing
            // the stage on it hid the picture during the switch - the audio kept
            // going, because the engine was working fine - and left a black box
            // that only a manual stop cleared. Only an explicit stop collapses
            // the stage, so only an explicit stop hides it.
            if (st.drawn > 0) showIdle();
          });
          // Exposed so the picture and the audio chain can be inspected from the
          // console, and so the test suite can read real state rather than
          // scraping the DOM for it.
          window.__eng = engine;
          return engine;
        }).catch(function (e) {
          libsLoading = null;
          throw e;
        });
        return libsLoading;
      }

      // A quiet, self-clearing message. In a car this has to be readable at a
      // glance and then get out of the way.
      function showNote(msg, ms) {
        noteEl.textContent = msg;
        noteEl.classList.add('show');
        clearTimeout(noteTimer);
        noteTimer = setTimeout(function () { noteEl.classList.remove('show'); }, ms || 3600);
      }

      // If the engine cannot run this channel, hand it back to video.js rather
      // than leaving a dead screen. 83 channels of unknown configs means this
      // will happen eventually.
      function onEngineFail(msg) {
        showIdle();
        showNote('InMotion can\'t play this channel - using the normal player', 4200);
        fallbackToVideoJs();
      }

      function fallbackToVideoJs() {
        setDrive(false, true);
        if (currentChannel) loadChannel(currentChannel);
      }

      function setDrive(on, skipPersist) {
        DRIVE.on = !!on;
        if (!skipPersist) {
          try { localStorage.setItem('livetv.drive', DRIVE.on ? '1' : '0'); } catch (e) {}
        }
        driveToggle.classList.toggle('on', DRIVE.on);
        driveToggle.setAttribute('aria-pressed', DRIVE.on ? 'true' : 'false');
        // The label does not change with the state: the pill is green with a
        // glowing dot when on and grey when off, which is a clearer signal than
        // a word that has to be read. aria-pressed still carries the state for
        // anything that cannot see the colour.
        driveLabel.textContent = 'InMotion';
        document.getElementById('myPlayer').classList.toggle('hidden-el', DRIVE.on);
        // Switching modes mid-playback: stop whichever one is running so the
        // two never fight over the audio device. Leaving InMotion mode tears the
        // whole engine down, audio chain included.
        if (DRIVE.on) {
          try { player.pause(); } catch (e) {}
          // Turning the mode on does not by itself bring the picture up: nothing
          // is playing until a channel is tapped.
          setStageUp(!!currentChannel);
        } else if (engine) {
          setStageUp(false);
          engine.destroy(); engine = null; window.__eng = null; libsLoading = null;
        } else {
          setStageUp(false);
        }
        // Which surface is showing just changed, so whether there is a picture
        // under the banner changed with it.
        epgSync();
      }

      // Build the engine if it is not there yet, then play a channel through it.
      //
      // This is reached on a page LOAD as well as from the toggle, and that
      // matters: the libraries are only fetched the first time InMotion is
      // used, but the choice itself is remembered. So someone who refreshes
      // with InMotion already on arrives with the toggle lit, the canvas
      // showing and no engine - and the only thing that ever built one was the
      // toggle tap they had not made yet. Checking for the engine here and
      // quietly falling through to video.js put the picture into a hidden
      // element: audio, no image, and a black canvas.
      function startDrive(channel) {
        // Bring the stage up at the same moment as the spinner, so the loading
        // state is never rendered into a hidden box.
        setStageUp(true);
        showLoading();
        ensureEngine().then(function () {
          // The toggle may have been flipped back while we were loading.
          if (!DRIVE.on) { showIdle(); return; }
          openDrive(channel);
        }).catch(function (e) {
          showIdle();
          showNote('Could not start InMotion mode: ' + e.message, 5000);
          fallbackToVideoJs();
        });
      }

      driveToggle.addEventListener('click', function () {
        var next = !DRIVE.on;
        setDrive(next);
        if (next) {
          if (currentChannel) startDrive(currentChannel);
          // No channel chosen yet: just warm the engine up, so the first tap
          // starts instantly instead of waiting on three scripts.
          else ensureEngine().catch(function (e) {
            showIdle();
            showNote('Could not start InMotion mode: ' + e.message, 5000);
            fallbackToVideoJs();
          });
        }
      });

      // Tapping CHANNELS stops whatever is playing. In a car the grid is always
      // right there, so it is the obvious target for "I want it off" - and a
      // black box with no way to dismiss it is worse than no picture at all.
      function stopPlayback() {
        if (engine) engine.close();
        // Only clear the source if one is actually loaded. Setting src to ""
        // on an element that never had a source makes video.js log
        // MEDIA_ERR_SRC_NOT_SUPPORTED for no reason, and in InMotion mode the
        // normal player is usually empty anyway.
        try {
          player.pause();
          var el = document.getElementById('myPlayer');
          if (el && el.currentSrc) player.src("");
        } catch (e) {}
        var video = document.getElementById('myPlayer');
        video.style.display = "none";
        video.classList.remove('vjs-fluid');
        currentChannel = null;
        showEpg(null);
        if (selected) { selected.classList.remove('selected'); selected = null; }
        // Collapse the stage: with nothing playing there is nothing to show, and
        // an empty black box above the grid just pushes the channels off screen.
        setStageUp(false);
        showIdle();
        if (canvas.getContext) {
          try {
            var g = canvas.getContext('2d');
            g.fillStyle = '#000';
            g.fillRect(0, 0, canvas.width, canvas.height);
          } catch (e) {}
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      var channelsHeading = document.getElementById('channelsHeading');
      channelsHeading.addEventListener('click', stopPlayback);
      channelsHeading.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          stopPlayback();
        }
      });

      // Open a channel in the engine, with a guard so a channel that cannot
      // start does not sit on a blank canvas forever.
      function openDrive(channel) {
        if (!engine) return;
        var url = channelUrl(channel);
        engine.open(url, { name: channel });
        // Read the generation AFTER open(): open() bumps it itself, so
        // capturing it beforehand would never match and the guard below would
        // fire on a channel that is actually fine.
        var gen = engine.gen;
        setTimeout(function () {
          // Order matters, and all three checks are needed. InMotion being off
          // means the engine's own 'fail' event has already handed this channel
          // back to video.js; without that check the fallback and this timeout
          // both fire and the stream is torn down and started twice, which on a
          // slow car connection is two visible stalls instead of one. Turning
          // the toggle off also DESTROYS the engine, so `engine` can be null by
          // the time this runs - and reading .gen on it throws.
          if (!DRIVE.on || !engine) return;
          if (engine.gen !== gen) return;
          var st = engine.state();
          if (st.stage === 'error' || (!st.drawn && st.fatal)) {
            showIdle();
            showNote('InMotion can\'t play this channel - using the normal player', 4200);
            fallbackToVideoJs();
          }
        }, 9000);
      }

      function channelUrl(channel) {
        var base = baseUrl1 + baseUrl2 + baseUrl3 + baseUrl4 + baseUrl5 + baseUrl6 + baseUrl7 + baseUrl8;
        return streamOverrides[channel] || base + channel + '.m3u8';
      }

      function loadChannel(channel) {
        var video = document.getElementById("myPlayer");
        window.scrollTo({ top: 0, behavior: 'smooth' });
        currentChannel = channel;
        showEpg(channel);
        // Gate on the mode the user asked for, NOT on whether the engine happens
        // to be built yet. Checking `engine` here was the bug: on a restored
        // InMotion session it is still null, so this fell through to video.js
        // - whose element setDrive() had already hidden - giving audio with a
        // black canvas and no way out except toggling twice.
        if (DRIVE.on) { startDrive(channel); return; }
        video.style.display = "block";
        video.classList.add("vjs-fluid");
        player.src({ src: channelUrl(channel), type: 'application/x-mpegURL' });
        player.play();
        // The element is on screen now but there is no picture in it yet. Show
        // the banner on the first one that arrives rather than over the blank.
        video.addEventListener('loadeddata', function once() {
          video.removeEventListener('loadeddata', once);
          epgSync();
        });
      }

      function closeFrame() {
        stopPlayback();
      }

      function selectChannel(el, name) {
        if (selected) selected.classList.remove("selected");
        selected = el;
        el.classList.add("selected");
        loadChannel(name);
      }

      const streamOverrides = {
        'F1TV': 'https://amg12058-c15studio-amg12058c1-lg-us-5787.playouts.now.amagi.tv/playlist.m3u8'
      };

      const favorites = ['F1TV', 'qkihgakk.ss', 'cnbc.usa.us', 'msnbc.usa.us', 'cnn.us', 'fox.news.us', 'bravo.usa.eastern.us', 'comedy.central.eastern.us'];

      async function loadChannels() {
        let channels = await (await fetch('channels.json')).json();
        const favFirst = favorites.map(name => ({ name })).concat(channels.filter(c => !favorites.includes(c.name)));
        const grid = document.getElementById('channelGrid');
        const logoUrls = [];

        favFirst.forEach(channel => {
          const name = channel.name;
          const logo = `logos/${name}.png`;
          logoUrls.push(logo);

          const divider = document.createElement('div');
          divider.className = 'channel';
          divider.onclick = () => selectChannel(divider, name);

          const img = document.createElement('img');
          img.alt = name;
          img.onerror = () => { img.style.display = 'none'; };
          img.src = logo;

        divider.appendChild(img);
        grid.appendChild(divider);
        });

        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: 'CACHE_LOGOS', urls: logoUrls });
        }
      }

      loadChannels();

      // The guide, fetched once as the page loads and never again. Nothing waits
      // on it: by the time anyone taps a channel it is normally already indexed,
      // and if it is not, the banner fills in when it lands.
      epgRefresh();

      // "Up next in 12 min" has to keep counting even if the page is left open
      // for hours, which in a parked car it will be. Cheap: one repaint a minute
      // and nothing at all while the bar is hidden.
      setInterval(function () {
        // Re-check the frame as well as the clock. This is what puts the banner
        // up when playback finally starts, and takes it down again if the frame
        // goes away - the two events are not otherwise hooked together, and
        // waiting on both would mean a tap before the first frame simply did
        // nothing.
        epgSync();
        if (currentChannel && !epgBar.classList.contains('hidden-el')) epgPaintCountdown();
      }, 400);

      // Apply the stored choice. The engine is only built once the toggle is
      // actually used, so a returning Drive-mode visitor sees the canvas and
      // the toggle lit, and nothing is downloaded until they pick a channel.
      setDrive(DRIVE.on, true);
      setWide(WIDE, true);
      setMute(MUTED, true);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
  </body>
</html>
